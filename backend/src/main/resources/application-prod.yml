spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: ${SESSION_COOKIE_SAME_SITE}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
pethop:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    registration:
      max-requests: ${RATE_LIMIT_REGISTRATION_MAX_REQUESTS:5}
      window-seconds: ${RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:3600}
    uploads:
      max-requests: ${RATE_LIMIT_UPLOAD_MAX_REQUESTS:30}
      window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}
    reports:
      max-requests: ${RATE_LIMIT_REPORT_MAX_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_REPORT_WINDOW_SECONDS:3600}
    veterinary-assistant:
      max-requests: ${RATE_LIMIT_VETERINARY_MAX_REQUESTS:20}
      window-seconds: ${RATE_LIMIT_VETERINARY_WINDOW_SECONDS:3600}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS}
  storage:
    local-path: ${FILE_STORAGE_PATH}
    max-image-size: 10485760
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:false}
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:https://localhost}
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    required: ${EMAIL_VERIFICATION_REQUIRED:false}
    mail-enabled: ${EMAIL_VERIFICATION_MAIL_ENABLED:false}
    frontend-url: ${EMAIL_VERIFICATION_FRONTEND_URL:https://localhost}
    token-ttl-minutes: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:60}
  brevo:
    api-key: ${BREVO_API_KEY:}
    from: ${BREVO_FROM_EMAIL:no-reply@pethop.local}
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  veterinary-ai:
    enabled: ${VETERINARY_AI_ENABLED:false}
    api-key: ${VETERINARY_AI_API_KEY:}
    base-url: ${VETERINARY_AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${VETERINARY_AI_MODEL:openai/gpt-oss-20b}
    connect-timeout-ms: ${VETERINARY_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-seconds: ${VETERINARY_AI_READ_TIMEOUT_SECONDS:30}
    max-output-tokens: ${VETERINARY_AI_MAX_OUTPUT_TOKENS:700}
    max-retries: ${VETERINARY_AI_MAX_RETRIES:1}
