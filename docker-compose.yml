services:
  postgres:
    image: postgres:17-alpine
    container_name: pethop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pethop}
      POSTGRES_USER: ${POSTGRES_USER:-pethop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pethop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pethop} -d ${POSTGRES_DB:-pethop}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pethop-postgres-data:
